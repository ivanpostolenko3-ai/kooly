name = "kooly-proxy"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Сайты, страницы которых можно читать через /page (через запятую). Поддомены разрешены автоматически.
ALLOWED_SITES = "nerg.ee,ope.ee,stuudium.com"

[ai]
binding = "AI"

# «Mängud»: комната-лобби на каждую школу (Durable Object на SQLite — есть в бесплатном плане)
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "GameLobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameLobby"]
