<!DOCTYPE html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f7f6" />
    <meta name="description" content="Kooly — kooliabiline: tunniplaan, tunni taimer, ranits ja ülesanded." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kooly" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="preload" href="fonts/mulish-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <title>Kooly</title>
    <script>
      // Тема ставится до отрисовки, чтобы не было вспышки не того цвета.
      try {
        const theme = JSON.parse(localStorage.getItem("kooly.v1") || "{}").theme;
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="styles.css?v=28" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">K</span>
        <span>Kooly</span>
      </div>
      <div class="clock" id="clock"></div>
      <button class="theme-btn" id="settings-btn" aria-label="Seaded">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
      </button>
    </header>

    <main class="view" id="view"></main>

    <div class="toast" id="toast" hidden></div>

    <nav class="tabbar" aria-label="Vahekaardid">
      <button data-tab="now">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" /><path d="M12 9v4l2.5 2.5M10 2h4" /></svg>
        Praegu
      </button>
      <button data-tab="tomorrow">
        <svg class="i" viewBox="0 0 24 24"><path d="M5 10a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v9a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z" /><path d="M9 6V5a3 3 0 0 1 6 0v1M5 13h14M10 13v2h4v-2" /></svg>
        Homme
      </button>
      <button data-tab="tasks">
        <svg class="i" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="4" /><path d="m8.5 9 1.5 1.5L13 7.5M8.5 15.5l1.5 1.5 3-3M15.5 9.5h1M15.5 16h1" /></svg>
        Ülesanded
      </button>
      <button data-tab="calendar">
        <svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="4" /><path d="M3 10h18M8 3v4M16 3v4" /><circle cx="12" cy="15.5" r="1.6" /></svg>
        Kalender
      </button>
      <button data-tab="progress">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 20h16M7 16v-4M12 16V7M17 16v-6" /></svg>
        Edenemine
      </button>
      <button data-tab="games">
        <svg class="i" viewBox="0 0 24 24"><path d="M7 7h10a5 5 0 0 1 4.9 6l-.6 3a2.6 2.6 0 0 1-4.5 1.2L15 15H9l-1.8 2.2a2.6 2.6 0 0 1-4.5-1.2l-.6-3A5 5 0 0 1 7 7z" /><path d="M8 10v3M6.5 11.5h3M15.5 11h.01M17.5 13h.01" /></svg>
        Mängud
      </button>
    </nav>

    <script src="connect.js?v=28"></script>
    <script src="edupage.js?v=28"></script>
    <script src="stuudium.js?v=28"></script>
    <script src="progress.js?v=28"></script>
    <script src="menu.js?v=28"></script>
    <script src="calendar.js?v=28"></script>
    <script src="games-rules.js?v=28"></script>
    <script src="games.js?v=28"></script>
    <script src="app.js?v=28"></script>
  </body>
</html>
