# Проект Xcode генерируется из этого файла: `xcodegen generate` (в папке ios/).
name: Kooly
options:
  bundleIdPrefix: ee.kooly.ivan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: HPRPFWB98T
targets:
  Kooly:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kooly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSSupportsLiveActivities: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [ee.kooly.refresh]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Kooly kuulab sind, kui vajutad mikrofoni ja dikteerid ülesande.
    entitlements:
      path: App/Kooly.entitlements
      properties:
        com.apple.security.application-groups: [group.ee.kooly.ivan]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ee.kooly.ivan.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: KoolyWidgets
  KoolyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Kooly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/KoolyWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.ee.kooly.ivan]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ee.kooly.ivan.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
